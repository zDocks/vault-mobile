name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: ⚙️ Expo Prebuild (Gerar projeto Android nativo)
        env:
          EXPO_PUBLIC_API_URL: https://api.zdocks.me
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Compilar APK Android (Release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🔍 Localizar e Renomear APK
        run: |
          mkdir -p build_output
          APK_PATH=$(find android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build_output/vault.apk
            echo "APK encontrado e preparado com sucesso: build_output/vault.apk"
          else
            echo "❌ Erro: Ficheiro APK não encontrado após compilação!"
            exit 1
          fi

      - name: 🚀 Criar GitHub Release e Anexar APK
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/vault.apk
          tag_name: ${{ github.ref_name }}
          name: Vault ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
